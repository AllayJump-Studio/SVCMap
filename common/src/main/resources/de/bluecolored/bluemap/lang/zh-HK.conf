# 遊戲內網頁帳號指令（/bluemap webregister、/bluemap webunregister）的文字。
#
# 想翻譯或修改，就把同樣格式的檔案放到 <插件設定資料夾>/lang/<語言>.conf，
# 只保留你想改的行就可以，缺的行會依次回退到內建語言、最後回退到英文。
# 語言取自玩家自己的客戶端語言設定。
#
# %s 是佔位符，請原樣保留。

common: {
  disabled: "網頁登入系統尚未啟用。"
  disabled-hint: "請在 %s 中將 %s 設定為 true，然後執行 /bluemap reload。"
  save-failed: "儲存網頁帳戶檔案失敗！請查看伺服器日誌。"
  player-only: "此指令需要由玩家執行。"
  player-only-hint: "請改用 %s 為在線玩家產生驗證碼。"
  invalid-name: "%s 不是合法的帳戶名稱（1-16 位，只可包含 a-z、0-9、_）。"
  no-online-player: "沒有名為 %s 的在線玩家。"
}

register: {
  issued-title: "已為 %s 開始網頁註冊。"
  passcode: "驗證碼：%s"
  expires: "有效期 %s 分鐘，且只可使用一次。"
  open: "開啟 %s 並輸入驗證碼完成註冊。"
  warning: "請勿使用你的 Minecraft 密碼作為網頁密碼。"
  exists: "%s 已經有網頁帳戶。"
  exists-hint: "管理員可以用 %s 刪除後重新註冊。"
  target-title: "有人為你開啟了網頁註冊。"
  target-open: "開啟 %s 並輸入上面的驗證碼。"
  target-unreachable: "未能在遊戲內通知該玩家，請私下把驗證碼轉交給他。"
}

unregister: {
  done: "已刪除 %s 的網頁帳戶。"
  done-hint: "該玩家可以用 %s 重新註冊。"
  missing: "%s 沒有網頁帳戶。"
}
