# 游戏内网页账号指令（/bluemap webregister、/bluemap webunregister）的文本。
#
# 想翻译或修改，就把同样格式的文件放到 <插件配置目录>/lang/<语言>.conf，
# 只保留你想改的行即可，缺的行会依次回退到内置语言、最后回退到英文。
# 语言取自玩家自己的客户端语言设置。
#
# %s 是占位符，请原样保留。

common: {
  disabled: "网页登录系统尚未启用。"
  disabled-hint: "请在 %s 中把 %s 设为 true，然后执行 /bluemap reload。"
  save-failed: "保存网页账号文件失败！请查看服务器日志。"
  player-only: "这个指令需要由玩家执行。"
  player-only-hint: "请改用 %s 为在线玩家生成验证码。"
  invalid-name: "%s 不是合法的账号名（1-16 位，只能包含 a-z、0-9、_）。"
  no-online-player: "没有名为 %s 的在线玩家。"
}

register: {
  issued-title: "已为 %s 开始网页注册。"
  passcode: "验证码：%s"
  expires: "有效期 %s 分钟，且只能使用一次。"
  open: "打开 %s 并输入验证码完成注册。"
  warning: "请不要使用你的 Minecraft 密码作为网页密码。"
  exists: "%s 已经有网页账号了。"
  exists-hint: "管理员可以用 %s 删除后重新注册。"
  target-title: "有人为你开启了网页注册。"
  target-open: "打开 %s 并输入上面的验证码。"
  target-unreachable: "无法在游戏内通知该玩家，请私下把验证码转交给他。"
}

unregister: {
  done: "已删除 %s 的网页账号。"
  done-hint: "该玩家可以用 %s 重新注册。"
  missing: "%s 没有网页账号。"
}
