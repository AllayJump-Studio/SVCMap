# Texts for the in-game web-account commands (/bluemap webregister, /bluemap webunregister).
#
# To translate or customize, put a file like this one into <plugin-config-folder>/lang/<language>.conf
# and only keep the lines you want to change. Any missing line falls back to the bundled language,
# then to english. The language is picked from the player's own client language.
#
# %s is a placeholder and gets replaced, keep it as it is.

common: {
  disabled: "The web-login system is disabled."
  disabled-hint: "Enable %s in %s and reload BlueMap."
  save-failed: "Failed to save the web-account file! See the server log for details."
  player-only: "This command needs to be executed by a player."
  player-only-hint: "Use %s to issue a passcode for an online player."
  invalid-name: "%s is not a valid account name (1-16 of a-z, 0-9, _)."
  no-online-player: "There is no online player named %s."
}

register: {
  issued-title: "Web-registration started for %s."
  passcode: "Passcode: %s"
  expires: "Valid for %s minutes, and only once."
  open: "Open %s and enter the passcode there."
  warning: "Do not reuse your Minecraft password for the website."
  exists: "%s already has a web-account."
  exists-hint: "An administrator can delete it with %s and start over."
  target-title: "A web-account registration was started for you."
  target-open: "Open %s and enter it there."
  target-unreachable: "The player could not be notified in-game, please pass the code on privately."
}

unregister: {
  done: "Deleted the web-account of %s."
  done-hint: "The player can register again with %s."
  missing: "There is no web-account for %s."
}
