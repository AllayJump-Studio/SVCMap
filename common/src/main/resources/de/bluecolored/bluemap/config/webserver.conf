##                          ##
##         BlueMap          ##
##     Webserver-Config     ##
##                          ##

# With this setting you can disable the integrated webserver.
# This is useful if you want to only render the map data for later use, or if you setup your own webserver.
# Default is true
enabled: true

# The webroot that the server will host to the web.
# Usually this should be set to the same directory like in the webapp.conf!
# Default is "bluemap/web"
webroot: "${webroot}"

# The port that the webserver listens to.
# Default is 8100
port: 8100

# Whether to use Server-Sent Events (SSE) for pushing tile and marker-updates to the connected clients.
# Default is true
sse-enabled: true

# Additional headers the webserver should include in the responses it sends.
# Default is none
additional-headers: {
  "Cache-Control": "public, max-age=86400, stale-if-error=604800"
  "CDN-Cache-Control": "max-age=60"
  # "Content-Security-Policy": "default-src 'self'; connect-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; object-src 'none';"
  # "X-Frame-Options": "SAMEORIGIN"
  # "X-Content-Type-Options": "nosniff"
  # "Referrer-Policy": "strict-origin-when-cross-origin"
  # "Permissions-Policy": "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
}

# Config-section for webserver activity logging:
log: {
  # The file where all the webserver activity will be logged to.
  # Comment out to disable the logging completely.
  # Java String formatting syntax can be used to add timestamps, see: https://docs.oracle.com/javase/8/docs/api/java/util/Formatter.html
  # Default is no logging.
  file: "${logfile}"
  #file: "${logfile-with-time}"

  # Whether the logger should append to an existing file, or overwrite it.
  # Default is false (overwrite the file).
  append: false

  # The format of the webserver activity logs.
  # The syntax is the Java String formatting syntax, see: https://docs.oracle.com/javase/8/docs/api/java/util/Formatter.html
  # Possible Arguments:                                                    | Example output
  #  1 - the source address (ignoring any xff headers).                    | 10.10.10.10
  #  2 - the source address (using the (leftmost) xff header if provided). | 88.66.44.22
  #  3 - the http method of the request.                                   | GET
  #  4 - the full request address.                                         | /assets/file.png 
  #  5 - the protocol version of the request.                              | HTTP/1.1
  #  6 - the status code of the response.                                  | 200
  #  7 - the status message of the response.                               | OK
  # Default is "%1$s \"%3$s %4$s %5$s\" %6$s %7$s"                         | 10.10.10.10 "GET /assets/file.png HTTP/1.1" 200 OK
  format: "%1$s \"%3$s %4$s %5$s\" %6$s %7$s"
}

# Config-section for the web-account / login system.
#
# IMPORTANT: passwords are sent over plain HTTP, so anyone on the network path can read them.
# Do not reuse your Minecraft password here, and only enable this on a network you trust
# (or put the webserver behind a reverse proxy that terminates TLS).
#
# To enable it:
#   1. keep "enabled" on false for now
#   2. run "/bluemap webregister" in-game and complete the registration on the website
#   3. set "enabled" to true and run "/bluemap reload"
# The accounts are stored in webauth.json next to this file.
auth: {
  # If this is true, the login system is active and (with require-login) the whole map is
  # only served to logged-in users.
  # Default is false (so that an update does not suddenly lock your map)
  enabled: false

  # If this is true, all map data (tiles, live updates, markers, sse) is rejected with a 401
  # until the user has logged in. Only the webapp shell and the login endpoints stay reachable.
  # Default is true
  require-login: true

  # How many days a login stays valid.
  # Default is 7
  session-days: 7

  # How many days a login stays valid when "remember me" was checked on the login page.
  # Default is 30
  remember-days: 30

  # After this many minutes without any activity, the server stops pushing new map data to the
  # browser. The client has to move the view to resume the updates.
  # Set this to 0 or lower to disable.
  # Default is 60
  idle-timeout-minutes: 60

  # How long a registration passcode from "/bluemap webregister" stays valid, in minutes.
  # Default is 10
  passcode-expiry-minutes: 10

  # The minimum length of a web-account password.
  # Default is 8
  min-password-length: 8

  # Only used to print a usable url in the registration command.
  # Leave empty to fall back to "http://<server-ip>:<port>/".
  # Default is none
  public-url: ""
}
