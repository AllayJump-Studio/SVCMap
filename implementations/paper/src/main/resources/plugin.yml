name: BlueMap
description: "A 3d-map of your Minecraft worlds view-able in your browser using three.js (WebGL)"
main: de.bluecolored.bluemap.bukkit.BukkitPlugin
version: "${version}"
api-version: "${api_version}"
folia-supported: true
author: "Blue (TBlueF / Lukas Rieger)"
website: "https://github.com/BlueMap-Minecraft"

libraries:
  - "com.flowpowered:flow-math:${flow_math_version}"

permissions:
  bluemap.webregister:
    description: "Start the web-registration process for your own web-account"
    default: true
  bluemap.webregister.other:
    description: "Start the web-registration process for another (online) player"
    default: op
  bluemap.webchat:
    description: "Send chat messages from the webapp into the game"
    default: true
  bluemap.webunregister:
    description: "Delete a web-account (also used to reset a password)"
    default: op
